plugins {
    id 'com.android.application'
}

android {
    namespace 'com.levelup.droiduplauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.levelup.droiduplauncher"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.7.0-dex"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure Android framework APIs
}
